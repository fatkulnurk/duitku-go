name: Go

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23', '1.24', '1.25', '1.26']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true
        # Enables the built-in module and build cache, before any build step.
        cache: true

    - name: Verify gofmt
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "The following files are not gofmt formatted:"
          echo "$unformatted"
          exit 1
        fi

    - name: Get dependencies
      run: go mod download

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race -v ./...

    - name: Run staticcheck
      # Pinned for reproducibility. Only run on the newest Go so the tool
      # version and the toolchain version stay compatible.
      if: ${{ matrix.go-version == '1.26' }}
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
        staticcheck ./...

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        check-latest: true
        cache: true

    - name: Get dependencies
      run: go mod download

    - name: Generate coverage report
      run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        flags: unittests
        token: ${{ secrets.CODECOV_TOKEN }}
